[project]
name = "logo-3d"
version = "0.1.0"
description = "3D-printable logo of the Sovereign Self-Healing demo, modelled in build123d"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "build123d==0.13.0",
]

[project.optional-dependencies]
# Colored PNG previews. Optional: the geometry, the exports and the tests work
# without a plotting stack.
preview = ["matplotlib>=3.8"]

[project.scripts]
logo-3d-export = "logo_3d.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pytest>=8,<9",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logo_3d"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
